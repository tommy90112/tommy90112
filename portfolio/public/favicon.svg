<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The same causal fork the hero draws: two candidate causes, one intervened
    on, feeding a single effect.

    The ground follows the viewer's theme, because a tab strip is either paper
    or charcoal and a fixed dark tile looks like a hole punched in a light one.
    Marks stay on the accent and neutral ramp so they read on both.
  -->
  <style>
    .ground { fill: #FAF8F4 }
    .rule   { stroke: #C7BCAC }
    .quiet  { fill: #C7BCAC }
    .mark   { fill: #AC3A22 }
    .effect { fill: #8D6E2E }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #12100E }
      .rule   { stroke: #52493E }
      .quiet  { fill: #52493E }
      .mark   { fill: #E8744E }
      .effect { fill: #D5B06A }
    }
  </style>

  <rect class="ground" width="64" height="64" rx="14"/>

  <g class="rule" stroke-width="2.5" stroke-linecap="round">
    <line x1="20" y1="20" x2="32" y2="38"/>
    <line x1="44" y1="20" x2="32" y2="38"/>
  </g>

  <!-- intervened cause -->
  <circle class="mark" cx="20" cy="20" r="7"/>
  <!-- observed cause -->
  <circle class="quiet" cx="44" cy="20" r="5.5"/>
  <!-- effect -->
  <circle class="effect" cx="32" cy="42" r="6.5"/>
</svg>
